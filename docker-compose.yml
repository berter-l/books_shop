services:

  main_app:
    build:
      context: main_app/
      dockerfile: Dockerfile
    image: main_app_image
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  postgres:
    image: postgres
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop_db"]
      timeout: 5s
      retries: 3
      interval: 10s

  redis:
    image: redis
    container_name: shop-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_beat:
    build:
      context: celery_beat_app/
      dockerfile: Dockerfile_celery_beat

    image: celery_beat
    container_name: celery_beat
    command: celery -A celery_beat_tasks:main_celery_app beat --loglevel=info
    depends_on:
      main_app:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Контейнер для обработки периодических задач.
  celery_workers_for_interval_tasks:
    build:
      context: celery_beat_app/
      dockerfile: Dockerfile_celery_beat

    image: celery_workers_for_interval_tasks
    container_name: celery_workers_for_interval_tasks
    command: celery -A celery_beat_tasks:main_celery_app worker -Q expired_tokens
    depends_on:
      main_app:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # контейнер для отправки писем.
  celery_email_workers:
    build:
      context: email_app/
      dockerfile: Dockerfile_celery_email
    image: celery_email_workers
    command: celery -A celery_email_tasks worker -Q emails
    container_name: celery_email_workers
    depends_on:
      rabbitmq:
        condition: service_healthy
      main_app:
        condition: service_started


  rabbitmq:
    image: rabbitmq:4.0.9-management
    ports:
      - "15672:15672"
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      timeout: 3s
      interval: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:
  rabbitmq: